<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Travel Map</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map-container {
            width: 100vw;
            height: 100vh;
        }

        #tooltip {
            position: absolute;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .hover {
            stroke: #333;
            stroke-width: 2;
            fill-opacity: 0.6;
            cursor: pointer;
        }

        .visited {
            fill: #4caf50 !important;
        }

        .planned {
            fill: #2196f3 !important;
        }

        path {
            transition: fill 0.3s;
        }
    </style>
</head>
<body>

<div id="map-container"></div>
<div id="tooltip"></div>

<script>
    const API = 'http://localhost:5221/api/';
    const tooltip = document.getElementById('tooltip');
    const mapContainer = document.getElementById('map-container');

    const userCountries = {};

    async function loadUserCountries() {
        try {
            const res = await fetch(`${API}user/countries`, { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();
            console.log(data);
            data.forEach(x => {
                if (x.status) {
                    userCountries[x.countryName] = x.status.toLowerCase();
                }
            });

            console.log('Loaded countries:', userCountries);
        } catch (err) {
            console.error('Error loading user countries:', err);
        }
    }

    async function loadMap() {
        try {
            const res = await fetch(`${API}map/world`, { credentials: 'include' });
            if (res.status === 401) {
                window.location.href = 'login.html';
                return;
            }

            mapContainer.innerHTML = await res.text();
            const svg = mapContainer.querySelector('svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            const paths = svg.querySelectorAll('path');

            paths.forEach(p => p.removeAttribute('fill'));

            const countries = {};
            paths.forEach(path => {
                const name = path.getAttribute('name') || path.getAttribute('class');
                if (!name) return;

                path.dataset.country = name;

                if (!countries[name]) countries[name] = [];
                countries[name].push(path);
            });

            Object.keys(countries).forEach(name => {
                const countryPaths = countries[name];
                const state = userCountries[name];

                if (state) {
                    countryPaths.forEach(p => p.classList.add(state));
                }

                countryPaths.forEach(path => {
                    path.addEventListener('mouseenter', () => {
                        countryPaths.forEach(p => p.classList.add('hover'));
                        tooltip.textContent = state ? `${name} (${state})` : name;
                        tooltip.style.display = 'block';
                    });

                    path.addEventListener('mousemove', e => {
                        tooltip.style.left = e.pageX + 10 + 'px';
                        tooltip.style.top = e.pageY + 10 + 'px';
                    });

                    path.addEventListener('mouseleave', () => {
                        countryPaths.forEach(p => p.classList.remove('hover'));
                        tooltip.style.display = 'none';
                    });

                    path.addEventListener('click', async e => {
                        e.stopPropagation();

                        let nextState;
                        if (!userCountries[name]) nextState = 'planned';
                        else if (userCountries[name] === 'planned') nextState = 'visited';
                        else nextState = null;

                        if (nextState) userCountries[name] = nextState;
                        else delete userCountries[name];

                        countryPaths.forEach(p => p.classList.remove('planned', 'visited'));
                        if (nextState) countryPaths.forEach(p => p.classList.add(nextState));

                        try {
                            await fetch(`${API}user/countries`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                body: JSON.stringify({ Country: name, Status: nextState })
                            });
                        } catch (err) {
                            console.error('Error saving country state:', err);
                        }
                    });
                });
            });
        } catch (err) {
            console.error('Error loading map:', err);
        }
    }

    (async () => {
        await loadUserCountries();
        await loadMap();
    })();
</script>

</body>
</html>
