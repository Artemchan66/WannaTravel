<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Travel Map</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #tooltip {
            position: absolute;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .hover {
            stroke: #333;
            stroke-width: 2;
            fill-opacity: 0.6;
            cursor: pointer;
        }

        .visited {
            fill: #4caf50 !important;
        }

        .planned {
            fill: #2196f3 !important;
        }

        path {
            transition: fill 0.3s;
        }

        #country-popup {
            position: absolute;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            padding: 8px;
            display: none;
            z-index: 20;
            font-size: 14px;
        }

        #popup-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        #country-popup button {
            margin: 2px;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #country-popup button[data-state="planned"] {
            background: #2196f3;
            color: #fff;
        }

        #country-popup button[data-state="visited"] {
            background: #4caf50;
            color: #fff;
        }

        #country-popup button[data-state="none"] {
            background: #ccc;
        }

        #user-sidebar-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 40;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        #user-sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: rgba(255,255,255,0.95);
            box-shadow: 2px 0 10px rgba(0,0,0,0.25);
            transition: left 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        #user-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            font-size: 16px;
        }

        #user-sidebar-header button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        #user-sidebar-content {
            padding: 12px;
            flex: 1;
            overflow-y: auto;
        }

        #user-sidebar-content p {
            margin: 8px 0;
        }

        #user-sidebar-content button {
            margin-top: 12px;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #f44336;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="map-container"></div>
<div id="tooltip"></div>

<div id="country-popup">
    <div id="popup-title"></div>
    <button data-state="planned">Planned</button>
    <button data-state="visited">Visited</button>
    <button data-state="none">None</button>
</div>

<button id="user-sidebar-toggle">☰</button>

<div id="user-sidebar">
    <div id="user-sidebar-header">
        <span>User Info</span>
        <button id="close-sidebar">✕</button>
    </div>
    <div id="user-sidebar-content">
        <p><strong>Username:</strong> <span id="username">Loading...</span></p>
        <button id="logout-button">Logout</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
    const API = 'http://localhost:5221/api/';
    const tooltip = document.getElementById('tooltip');
    const mapContainer = document.getElementById('map-container');

    const popup = document.getElementById('country-popup');
    const popupTitle = document.getElementById('popup-title');

    const userCountries = {};
    let activeCountry = null;
    let activePaths = null;
    let panZoomInstance = null;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    mapContainer.addEventListener('mousedown', e => {
        isDragging = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
    });

    mapContainer.addEventListener('mousemove', e => {
        if (Math.abs(e.clientX - dragStartX) > 5 || Math.abs(e.clientY - dragStartY) > 5) {
            isDragging = true;
        }
    });

    async function loadUserCountries() {
        try {
            const res = await fetch(`${API}user/countries`, { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();
            data.forEach(x => {
                if (x.status) userCountries[x.countryName] = x.status.toLowerCase();
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function loadMap() {
        try {
            const res = await fetch(`${API}map/world`, { credentials: 'include' });
            if (res.status === 401) {
                window.location.href = 'login.html';
                return;
            }

            mapContainer.innerHTML = await res.text();
            const svg = mapContainer.querySelector('svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            const paths = svg.querySelectorAll('path');
            paths.forEach(p => p.removeAttribute('fill'));

            const countries = {};
            paths.forEach(path => {
                const name = path.getAttribute('name') || path.getAttribute('class');
                if (!name) return;
                path.dataset.country = name;
                if (!countries[name]) countries[name] = [];
                countries[name].push(path);
            });

            Object.keys(countries).forEach(name => {
                const countryPaths = countries[name];

                if (userCountries[name]) {
                    countryPaths.forEach(p => p.classList.add(userCountries[name]));
                }

                countryPaths.forEach(path => {
                    path.addEventListener('mouseenter', () => {
                        countryPaths.forEach(p => p.classList.add('hover'));
                        tooltip.textContent = userCountries[name]
                            ? `${name} (${userCountries[name]})`
                            : name;
                        tooltip.style.display = 'block';
                    });

                    path.addEventListener('mousemove', e => {
                        tooltip.style.left = e.pageX + 10 + 'px';
                        tooltip.style.top = e.pageY + 10 + 'px';
                    });

                    path.addEventListener('mouseleave', () => {
                        countryPaths.forEach(p => p.classList.remove('hover'));
                        tooltip.style.display = 'none';
                    });

                    path.addEventListener('click', e => {
                        e.stopPropagation();
                        if (isDragging) return;

                        activeCountry = name;
                        activePaths = countryPaths;
                        popupTitle.textContent = name;
                        popup.style.left = e.clientX + 'px';
                        popup.style.top = e.clientY + 'px';
                        popup.style.display = 'block';
                    });
                });
            });

            panZoomInstance = svgPanZoom(svg, {
                zoomEnabled: true,
                controlIconsEnabled: true,
                fit: true,
                center: true,
                minZoom: 0.5,
                maxZoom: 10,
                onZoom: () => { tooltip.style.display = 'none'; popup.style.display = 'none'; },
                onPan: () => { tooltip.style.display = 'none'; popup.style.display = 'none'; }
            });

        } catch (err) {
            console.error(err);
        }
    }

    popup.addEventListener('click', async e => {
        if (!e.target.dataset.state) return;

        let state = e.target.dataset.state;
        if (state === 'none') state = null;

        if (state) userCountries[activeCountry] = state;
        else delete userCountries[activeCountry];

        activePaths.forEach(p => p.classList.remove('planned', 'visited'));
        if (state) activePaths.forEach(p => p.classList.add(state));

        popup.style.display = 'none';

        try {
            await fetch(`${API}user/countries`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    Country: activeCountry,
                    Status: state
                })
            });
        } catch (err) {
            console.error(err);
        }
    });

    document.addEventListener('click', () => {
        popup.style.display = 'none';
    });

    (async () => {
        await loadUserCountries();
        await loadMap();
    })();

    const sidebar = document.getElementById('user-sidebar');
    const toggleButton = document.getElementById('user-sidebar-toggle');
    const closeButton = document.getElementById('close-sidebar');

    const usernameEl = document.getElementById('username');
    const logoutButton = document.getElementById('logout-button');

    toggleButton.addEventListener('click', (e) => {
        e.stopPropagation();
        sidebar.style.left = '0';
    });

    closeButton.addEventListener('click', () => {
        sidebar.style.left = '-250px';
    });

    document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && e.target !== toggleButton) {
            sidebar.style.left = '-250px';
        }
    });

    async function loadUserInfo() {
        try {
            const res = await fetch(`${API}users/me`, { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();
            usernameEl.textContent = data.name || 'N/A';
        } catch (err) {
            console.error(err);
            usernameEl.textContent = 'Error';
        }
    }

    logoutButton.addEventListener('click', async () => {
        try {
            await fetch(`${API}auth/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = 'login.html';
        } catch (err) {
            console.error(err);
        }
    });

    loadUserInfo();
</script>

</body>
</html>
